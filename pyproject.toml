[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viraldzen"
version = "0.1.0"
description = "Topic-selection: viral Dzen (Дзен) content without a browser"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Иван Олегович Озёрский" }]
keywords = ["dzen", "cursor", "agent-skills", "viral", "topic-selection"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://k-ai.pro/"

[project.scripts]
viraldzen = "viraldzen.cli:main"

[tool.setuptools]
packages = ["viraldzen"]
